# Security headers for greppit.app, installed as
# /etc/nginx/snippets/greppit-security-headers.conf by
# deploy/nginx/add-security-headers.sh.
#
# Included in the server block AND in every location that has its own
# add_header: nginx drops inherited add_header lines in such a location.
#
# The main Content-Security-Policy is a <meta> tag in frontend/index.html,
# next to the import map whose hash it lists. frame-ancestors only works
# as a header, so it's here; browsers enforce both policies.

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
