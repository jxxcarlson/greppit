# nginx server block for greppit.app
#
# Install:
#   sudo cp deploy/nginx/greppit.app.conf /etc/nginx/sites-available/greppit.app
#   sudo ln -s /etc/nginx/sites-available/greppit.app /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Expects the frontend static files at /root/greppit/frontend/ and the
# backend listening on 127.0.0.1:8086 (match GREPPIT_BACKEND_PORT in .env).
# TLS cert paths assume Cloudflare Origin Cert — see deploy/README.md.

server {
    listen 80;
    listen [::]:80;
    server_name greppit.app www.greppit.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name greppit.app www.greppit.app;

    ssl_certificate     /etc/ssl/greppit/origin.pem;
    ssl_certificate_key /etc/ssl/greppit/origin.key;

    # Static frontend
    root /root/greppit/frontend;
    index index.html;

    # Cache long for the elm bundle and CodeMirror; bust with a query string
    # when you ship a new build.
    location = /elm.js {
        add_header Cache-Control "public, max-age=3600";
    }
    location = /codemirror-element.js {
        add_header Cache-Control "public, max-age=31536000";
    }

    # API passthrough to the Haskell backend
    location /api/ {
        proxy_pass http://127.0.0.1:8086;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Everything else → static files, with SPA fallback to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't leak the elm source maps or vendored sources to prod.
    location ~ /\.(git|env|stack-work) { deny all; }
    location /elm-markdown/ { deny all; }
    location /src/          { deny all; }
    location /tests/        { deny all; }
}
