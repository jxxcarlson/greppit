# nginx server block for greppit.app
#
# Install (on the droplet, from the repo root):
#   sudo cp deploy/nginx/greppit.app.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/greppit.app.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then get the TLS cert — matches the scripta-on-this-droplet setup:
#   sudo certbot --nginx -d greppit.app -d www.greppit.app
#
# Certbot reads this HTTP-only block, adds a parallel `listen 443 ssl`
# block with the right cert paths, and inserts an HTTP → HTTPS redirect
# — same pattern as /etc/nginx/sites-available/scripta. All "managed by
# Certbot" additions land in the installed copy under
# /etc/nginx/sites-available/; do NOT copy those edits back to this file
# (keep this one HTTP-only so re-running `cp` doesn't clobber the cert
# section).

server {
    listen 80;
    server_name greppit.app www.greppit.app;

    # Static frontend (built with: `elm make src/Main.elm --optimize --output=elm.js`)
    root /root/greppit/frontend;
    index index.html;

    # Cache long for the elm bundle and the vendored CodeMirror; bust
    # with a query string when you ship a new build.
    location = /elm.js {
        add_header Cache-Control "public, max-age=3600";
    }
    location = /codemirror-element.js {
        add_header Cache-Control "public, max-age=31536000";
    }

    # API passthrough to the Haskell backend. Match GREPPIT_BACKEND_PORT in .env.
    location /api/ {
        proxy_pass http://127.0.0.1:8086;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Everything else → static files, with SPA fallback to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't leak source maps / vendored / dotfiles.
    location ~ /\.(git|env|stack-work) { deny all; }
    location /elm-markdown/ { deny all; }
    location /src/          { deny all; }
    location /tests/        { deny all; }
}
