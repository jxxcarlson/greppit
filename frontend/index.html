<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>greppit</title>

    <!-- Scissors favicon, bright yellow. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg stroke='%23ffd500' stroke-width='2.5' stroke-linecap='round' fill='none'%3E%3Ccircle cx='8' cy='9' r='3.5'/%3E%3Ccircle cx='8' cy='23' r='3.5'/%3E%3Cline x1='10.5' y1='11' x2='28' y2='21'/%3E%3Cline x1='10.5' y1='21' x2='28' y2='11'/%3E%3C/g%3E%3C/svg%3E">

    <!-- KaTeX CSS for math rendering; the JS is loaded dynamically below
         so the math-text custom element is defined only after KaTeX exists. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

    <!-- Import map so all CodeMirror packages share one @codemirror/state instance -->
    <script type="importmap">
    {
        "imports": {
            "@codemirror/state": "https://esm.sh/@codemirror/state@6.4.1",
            "@codemirror/view": "https://esm.sh/@codemirror/view@6.26.0?external=@codemirror/state",
            "@codemirror/commands": "https://esm.sh/@codemirror/commands@6.3.3?external=@codemirror/state,@codemirror/view,@codemirror/language",
            "@codemirror/autocomplete": "https://esm.sh/@codemirror/autocomplete@6.15.0?external=@codemirror/state,@codemirror/view,@codemirror/language,@lezer/common",
            "@codemirror/language": "https://esm.sh/@codemirror/language@6.10.1?external=@codemirror/state,@codemirror/view,@lezer/common,@lezer/highlight,@lezer/lr",
            "@codemirror/search": "https://esm.sh/@codemirror/search@6.5.6?external=@codemirror/state,@codemirror/view",
            "@codemirror/lint": "https://esm.sh/@codemirror/lint@6.5.0?external=@codemirror/state,@codemirror/view",
            "@lezer/common": "https://esm.sh/@lezer/common@1.2.1",
            "@lezer/highlight": "https://esm.sh/@lezer/highlight@1.2.0?external=@lezer/common",
            "@lezer/lr": "https://esm.sh/@lezer/lr@1.4.0?external=@lezer/common",
            "codemirror": "https://esm.sh/codemirror@6.0.1?external=@codemirror/state,@codemirror/view,@codemirror/commands,@codemirror/autocomplete,@codemirror/language,@codemirror/search,@codemirror/lint"
        }
    }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #222; }

        /* Header */
        .header { height: 50px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #ddd; background: #fff; }
        .header-left { display: flex; align-items: baseline; gap: 12px; }
        .header-title { font-weight: 600; font-size: 18px; color: #333; }
        .header-version { font-size: 12px; color: #999; letter-spacing: 0.5px; }
        .header-count { font-size: 13px; color: #777; }
        .header-right { display: flex; align-items: center; gap: 16px; }
        .header-email { color: #666; font-size: 13px; }

        /* Two-column body */
        .app { display: flex; height: calc(100vh - 50px); overflow: hidden; }
        .col-left { width: 340px; min-width: 340px; border-right: 1px solid #ddd; padding: 12px; overflow-y: auto; background: #fafafa; }
        .col-right { flex: 1; overflow-y: auto; padding: 16px; }

        /* Search */
        .search-input { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; outline: none; }
        .result-list { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
        .result-item { padding: 8px 10px; border: 1px solid #e0e0e0; border-radius: 4px; cursor: pointer; background: #fff; }
        .result-item:hover { background: #f0f4f9; }
        .result-item.selected { border-color: #0066cc; background: #eaf2fb; }
        .result-title { font-weight: 600; font-size: 14px; }
        .result-tags { color: #777; font-size: 12px; margin-top: 2px; }

        /* Display mode */
        .display-snippet { max-width: 42rem; }
        .display-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .display-title { font-size: 22px; font-weight: 600; }
        .display-tags { color: #777; font-size: 13px; margin-bottom: 16px; }
        .display-body h1, .display-body h2, .display-body h3 { margin: 0.7em 0 0.3em 0; }
        .display-body p { margin: 0.4em 0; line-height: 1.5; }
        .display-body code { background: #f3f3f3; padding: 1px 4px; border-radius: 3px; font-family: ui-monospace, Menlo, monospace; font-size: 0.95em; }
        .display-body pre { background: #f3f3f3; padding: 10px; border-radius: 4px; overflow-x: auto; }
        .display-body.display-body-plain { white-space: pre-wrap; word-wrap: break-word; line-height: 1.5; }

        /* Buttons */
        .btn { padding: 6px 14px; border-radius: 4px; font-size: 14px; cursor: pointer; border: 1px solid transparent; background: #fff; }
        .btn-primary { background: #0066cc; color: #fff; border-color: #0066cc; }
        .btn-secondary { color: #333; border-color: #bbb; }
        .btn-danger { background: #c23; color: #fff; border-color: #c23; }
        .btn:disabled { opacity: 0.5; cursor: default; }

        /* Editor */
        .editor-form { height: 100%; display: flex; flex-direction: column; gap: 10px; }
        .editor-split { flex: 1; display: flex; gap: 12px; min-height: 0; }
        .editor-source { flex: 1; min-width: 0; border: 1px solid #ccc; border-radius: 3px; overflow: hidden; display: flex; flex-direction: column; }
        .editor-source > div { flex: 1; min-height: 0; display: flex; flex-direction: column; }
        .editor-source codemirror-editor { flex: 1; min-height: 0; display: block; overflow: hidden; }
        .editor-preview { flex: 1; min-width: 0; overflow-y: auto; padding: 12px; border: 1px solid #e5e7eb; border-radius: 3px; }
        .editor-row { display: flex; gap: 10px; align-items: center; }
        .editor-row label { width: 90px; font-size: 13px; color: #555; }
        .editor-row input, .editor-row select { flex: 1; padding: 6px 8px; border: 1px solid #ccc; border-radius: 3px; font-size: 14px; }

        .editor-actions { display: flex; gap: 10px; margin-top: 10px; }

        /* Auth */
        .auth-page { display: flex; flex-direction: column; justify-content: flex-start; align-items: center; padding-top: 10vh; height: calc(100vh - 50px); background: #fafafa; }
        .auth-tagline { margin-bottom: 18px; font-size: 15px; color: #555; text-align: center; max-width: 340px; }
        .auth-form { width: 340px; padding: 24px; border: 1px solid #ddd; background: #fff; border-radius: 6px; }
        .auth-form h2 { margin-bottom: 14px; font-size: 20px; }
        .auth-field { margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
        .auth-field label { font-size: 13px; color: #555; }
        .auth-field input { padding: 8px; border: 1px solid #ccc; border-radius: 3px; font-size: 14px; }
        .auth-error { color: #c23; font-size: 13px; margin-bottom: 10px; }
        .auth-link { margin-top: 12px; font-size: 13px; color: #666; }
        .auth-link a { color: #0066cc; cursor: pointer; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="module" src="/codemirror-element.js"></script>
    <script src="/elm.js"></script>

    <script>
        // KaTeX <math-text> custom element. The v3 Scripta compiler sets the
        // `content` and `display` DOM *properties* (not attributes), so this
        // element exposes property setters and recovers properties that Elm
        // set before the element was upgraded.
        function initKatex() {
            class MathText extends HTMLElement {
                constructor() {
                    super();
                    this.attachShadow({ mode: "open" });
                    this._content = '';
                    this._display = false;
                }
                connectedCallback() {
                    this._upgradeProperty('content');
                    this._upgradeProperty('display');
                    this._render();
                }
                _upgradeProperty(prop) {
                    if (this.hasOwnProperty(prop)) {
                        let value = this[prop];
                        delete this[prop];
                        this[prop] = value;
                    }
                }
                set content(val) { this._content = val; if (this.isConnected) this._render(); }
                get content() { return this._content; }
                set display(val) { this._display = val; if (this.isConnected) this._render(); }
                get display() { return this._display; }
                _render() {
                    if (!this._content) return;
                    try {
                        this.shadowRoot.innerHTML = katex.renderToString(this._content, {
                            throwOnError: false,
                            displayMode: this._display,
                            trust: true
                        });
                    } catch (e) {
                        this.shadowRoot.innerHTML =
                            '<span style="color:red">' + (e && e.message ? e.message : 'KaTeX error') + '</span>';
                    }
                    let link = document.createElement('link');
                    link.setAttribute('rel', 'stylesheet');
                    link.setAttribute('href', 'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css');
                    this.shadowRoot.appendChild(link);
                }
            }
            customElements.define('math-text', MathText);
        }

        function loadMhchem() {
            var mhchem = document.createElement('script');
            mhchem.type = 'text/javascript';
            mhchem.src = "https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/mhchem.min.js";
            document.head.appendChild(mhchem);
        }

        var katexJs = document.createElement('script');
        katexJs.type = 'text/javascript';
        katexJs.onload = function() { initKatex(); loadMhchem(); };
        katexJs.onerror = function(e) { console.error("KaTeX failed to load", e); };
        katexJs.src = "https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js";
        document.head.appendChild(katexJs);

        // Flags for Elm
        var apiBase = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
            ? 'http://localhost:8085'
            : window.location.origin;

        var token = localStorage.getItem('greppit-token');

        var app = Elm.Main.init({
            node: document.getElementById('app'),
            flags: {
                apiBase: apiBase,
                initialToken: token
            }
        });

        app.ports.saveToken.subscribe(function(t) {
            localStorage.setItem('greppit-token', t);
        });
        app.ports.removeToken.subscribe(function() {
            localStorage.removeItem('greppit-token');
        });
    </script>
</body>
</html>
